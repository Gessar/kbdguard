# kbdguard — конфигурация демона
# Расположение: /etc/kbdguard/config.toml
# После правки: sudo systemctl restart kbdguard

[general]

# Защита: запрещать отключение, если в системе не останется ни одной
# включённой клавиатуры (например, внешняя не подключена).
protect_last_keyboard = true

# Состояние при старте демона: false = клавиатура включена.
start_disabled = false

# Всплывающие уведомления при переключении.
notify = true

[gesture]

# Жест: зажать любую клавишу из group1 и нажать любую из group2.
# Порядок и интервал между нажатиями не важны; третья клавиша отменяет жест.
group1 = ["KEY_LEFTCTRL", "KEY_RIGHTCTRL"]
group2 = ["KEY_LEFTALT", "KEY_RIGHTALT"]

# Подпись жеста для панели плагина.
label = "Ctrl + Alt"

[devices]

# Пусто = автоматически все внутренние (i8042/ISA) клавиатуры.
# Можно перечислить явно — подстрока имени или путь устройства:
#   mutable = ["AT Translated Set 2 keyboard"]
mutable = []

# Что не трогать никогда (подстрока имени или пути).
exclude = []
